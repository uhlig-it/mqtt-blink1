name: Release
on: {push: {tags: ["v*"]}}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: mqtt-blink1-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: mqtt-blink1-linux-arm64.tar.gz
          # 32-bit armhf for the Raspberry Pi ('shop': armv7l, bookworm).
          # Statically linked against musl (improvements.md §5.4): unlike the
          # previous glibc build (which needed isoc23_shim.c to paper over
          # glibc-version drift on the runners), this cannot break when the
          # runner image's glibc changes.
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            asset: mqtt-blink1-linux-armv7.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: mqtt-blink1-darwin-amd64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: mqtt-blink1-darwin-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # dtolnay/rust-toolchain@stable
        with: {targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # Swatinem/rust-cache@v2.9.2
      - name: Install musl-tools (x86_64/aarch64 musl targets)
        # armv7 has its own cross toolchain below: musl-tools only ships a
        # host-arch musl-gcc, and `contains('musl')` would also match -musleabihf.
        if: endsWith(matrix.target, 'unknown-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev
          # Tell the cc crate (used by the bundled C dependencies) to use musl-gcc
          TARGET_CC_VAR="CC_$(echo ${{ matrix.target }} | tr - _)"
          echo "$TARGET_CC_VAR=musl-gcc" >> "$GITHUB_ENV"
          # musl-gcc does not search /usr/include (it would pick up glibc headers),
          # so the vendored libusb cannot find the Linux UAPI headers. Symlink them
          # into the musl include dir instead.
          ARCH=$(echo ${{ matrix.target }} | sed 's/-unknown-linux-musl$//')
          MUSL_INCLUDE=/usr/include/${ARCH}-linux-musl
          sudo ln -s /usr/include/linux "$MUSL_INCLUDE/linux"
          sudo ln -s /usr/include/asm-generic "$MUSL_INCLUDE/asm-generic"
          sudo ln -s /usr/include/${ARCH}-linux-gnu/asm "$MUSL_INCLUDE/asm"
      - name: Install ARMv7 musl cross toolchain (armv7-unknown-linux-musleabihf target)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-libc-dev-armhf-cross
          # rustc defaults to the host `cc` for cross targets; hand it the ARMv7
          # musl linker. CC is what the cc crate and CMake use for the bundled C
          # dependencies (paho.mqtt.c, libusb). Do NOT set PKG_CONFIG_ALLOW_CROSS:
          # the libusb pkg-config probe must fail so libusb1-sys builds its
          # vendored copy with the cross compiler.
          curl -fsSL --retry 3 -o /tmp/arm-linux-musleabihf-cross.tgz https://musl.cc/arm-linux-musleabihf-cross.tgz
          sudo tar -xzf /tmp/arm-linux-musleabihf-cross.tgz -C /opt
          echo "/opt/arm-linux-musleabihf-cross/bin" >> "$GITHUB_PATH"
          echo "CC=arm-linux-musleabihf-gcc" >> "$GITHUB_ENV"
          echo "CC_armv7_unknown_linux_musleabihf=arm-linux-musleabihf-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=arm-linux-musleabihf-gcc" >> "$GITHUB_ENV"
          # The musl cross-gcc ships its own libc headers but no kernel headers,
          # so the vendored libusb cannot find the Linux UAPI headers. Symlink
          # them in (same idea as the musl-tools step above).
          MUSL_INCLUDE=/opt/arm-linux-musleabihf-cross/arm-linux-musleabihf/include
          sudo ln -s /usr/arm-linux-gnueabihf/include/linux "$MUSL_INCLUDE/linux"
          sudo ln -s /usr/arm-linux-gnueabihf/include/asm "$MUSL_INCLUDE/asm"
          sudo ln -s /usr/arm-linux-gnueabihf/include/asm-generic "$MUSL_INCLUDE/asm-generic"
      - name: Build
        # cmake >= 4 rejects the bundled paho.mqtt.c's outdated cmake_minimum_required policy
        env: {CMAKE_POLICY_VERSION_MINIMUM: "3.5"}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Verify the armv7 binary is statically linked (no glibc coupling)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          file target/${{ matrix.target }}/release/mqtt-blink1
          file target/${{ matrix.target }}/release/mqtt-blink1 | grep -q 'statically linked'
      - name: Compress binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset }} mqtt-blink1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Produce SHA-256 checksums (consumed by playbook.yml's binary_checksum)
        run: |
          cd artifacts
          for f in *.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
