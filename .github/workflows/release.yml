name: Release
on: {push: {tags: ["v*"]}}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: mqtt-blink1-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: mqtt-blink1-linux-arm64.tar.gz
          # 32-bit armhf for the Raspberry Pi ('shop': armv7l, Raspbian bookworm).
          # Static musl: glibc 2.38+ (Ubuntu runners) redirects strtol/sscanf/strtoul
          # to __isoc23_* (requires GLIBC_2.38), so a glibc build would not run on
          # shop's glibc 2.36. musl has no such symbol versioning.
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            asset: mqtt-blink1-linux-armv7.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: mqtt-blink1-darwin-amd64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: mqtt-blink1-darwin-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools (Linux musl targets)
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev
          # Tell the cc crate (used by the bundled C dependencies) to use musl-gcc
          TARGET_CC_VAR="CC_$(echo ${{ matrix.target }} | tr - _)"
          echo "$TARGET_CC_VAR=musl-gcc" >> "$GITHUB_ENV"
          # musl-gcc does not search /usr/include (it would pick up glibc headers),
          # so the vendored libusb cannot find the Linux UAPI headers. Symlink them
          # into the musl include dir instead.
          ARCH=$(echo ${{ matrix.target }} | sed 's/-unknown-linux-musl$//')
          MUSL_INCLUDE=/usr/include/${ARCH}-linux-musl
          sudo ln -s /usr/include/linux "$MUSL_INCLUDE/linux"
          sudo ln -s /usr/include/asm-generic "$MUSL_INCLUDE/asm-generic"
          sudo ln -s /usr/include/${ARCH}-linux-gnu/asm "$MUSL_INCLUDE/asm"
      - name: Install ARM musl cross toolchain (armv7 musleabihf target)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          # Prebuilt static musl cross toolchain from musl.cc; ships its own sysroot
          # incl. Linux headers and musl libc. The cc crate / CMake find
          # arm-linux-musleabihf-gcc themselves (cc maps this target triple to the
          # arm-linux-musleabihf prefix).
          curl -fsSL https://musl.cc/arm-linux-musleabihf-cross.tgz | tar xz -C /tmp
          echo "/tmp/arm-linux-musleabihf-cross/bin" >> "$GITHUB_PATH"
          # rustc defaults to the host `cc` for cross targets; hand it the ARM linker
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=arm-linux-musleabihf-gcc" >> "$GITHUB_ENV"
      - name: Build
        # cmake >= 4 rejects the bundled paho.mqtt.c's outdated cmake_minimum_required policy
        env: {CMAKE_POLICY_VERSION_MINIMUM: "3.5"}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Verify no glibc dependency (shop runs Debian 12, glibc 2.36)
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          HIGHEST=$(objdump -T target/${{ matrix.target }}/release/mqtt-blink1 \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          if [ -z "$HIGHEST" ]; then
            echo "Binary is fully static: no glibc dependency"
          else
            echo "::error::armv7 binary requires glibc ${HIGHEST#GLIBC_} but shop has 2.36"
            exit 1
          fi
      - name: Compress binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset }} mqtt-blink1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
