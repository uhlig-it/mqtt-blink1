name: Release
on: {push: {tags: ["v*"]}}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: mqtt-blink1-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: mqtt-blink1-linux-arm64.tar.gz
          # 32-bit armhf for the Raspberry Pi ('shop': armv7l, Raspbian bookworm).
          # glibc 2.38+ (Ubuntu runners) redirects strtol/sscanf/strtoul to
          # __isoc23_* (requires GLIBC_2.38), which shop's glibc 2.36 lacks;
          # isoc23_shim.c provides those entry points so the binary stays
          # compatible (see the Install ARM cross toolchain step).
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            asset: mqtt-blink1-linux-armv7.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: mqtt-blink1-darwin-amd64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: mqtt-blink1-darwin-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools (Linux musl targets)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev
          # Tell the cc crate (used by the bundled C dependencies) to use musl-gcc
          TARGET_CC_VAR="CC_$(echo ${{ matrix.target }} | tr - _)"
          echo "$TARGET_CC_VAR=musl-gcc" >> "$GITHUB_ENV"
          # musl-gcc does not search /usr/include (it would pick up glibc headers),
          # so the vendored libusb cannot find the Linux UAPI headers. Symlink them
          # into the musl include dir instead.
          ARCH=$(echo ${{ matrix.target }} | sed 's/-unknown-linux-musl$//')
          MUSL_INCLUDE=/usr/include/${ARCH}-linux-musl
          sudo ln -s /usr/include/linux "$MUSL_INCLUDE/linux"
          sudo ln -s /usr/include/asm-generic "$MUSL_INCLUDE/asm-generic"
          sudo ln -s /usr/include/${ARCH}-linux-gnu/asm "$MUSL_INCLUDE/asm"
      - name: Install ARM cross toolchain (armv7 gnueabihf target)
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          # rustc defaults to the host `cc` for cross targets; hand it the ARM
          # linker. Everything else (compiler, ar) is found by the cc crate / CMake
          # itself: cc maps armv7-unknown-linux-gnueabihf to an arm-linux-gnueabihf
          # prefix. Do NOT set PKG_CONFIG_ALLOW_CROSS: the libusb pkg-config probe
          # must fail so libusb1-sys builds its vendored copy with the cross compiler.
          # Then compile isoc23_shim.c (replaces the GLIBC_2.38-only __isoc23_* the
          # glibc headers redirect to) and link it into the final binary.
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          arm-linux-gnueabihf-gcc -std=gnu11 -fPIC -c isoc23_shim.c -o /tmp/isoc23_shim.o
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS=-C link-arg=/tmp/isoc23_shim.o" >> "$GITHUB_ENV"
      - name: Build
        # cmake >= 4 rejects the bundled paho.mqtt.c's outdated cmake_minimum_required policy
        env: {CMAKE_POLICY_VERSION_MINIMUM: "3.5"}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Verify glibc requirement (shop runs Debian 12, glibc 2.36)
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          HIGHEST=$(objdump -T target/${{ matrix.target }}/release/mqtt-blink1 \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Binary requires at most glibc ${HIGHEST#GLIBC_}; target host has 2.36"
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n2.36' "${HIGHEST#GLIBC_}" | sort -V | tail -1)" != "2.36" ]; then
            echo "::error::armv7 binary requires glibc ${HIGHEST#GLIBC_} but shop has 2.36"
            exit 1
          fi
      - name: Compress binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset }} mqtt-blink1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
